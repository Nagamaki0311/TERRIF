name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - id: artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for the uploaded Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo "The build did not return a valid Pages artifact ID."
            exit 1
          fi
          for attempt in {1..6}; do
            artifact_id=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id')
            if [[ "$artifact_id" == "$EXPECTED_ARTIFACT_ID" ]]; then
              echo "The uploaded Pages artifact is available."
              exit 0
            fi
            if [[ "$attempt" -lt 6 ]]; then
              sleep 5
            fi
          done
          echo "The expected Pages artifact was not available after six checks."
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
