# site/ を GitHub Pages に公開する。投稿（posts.json の更新）で自動実行し、
# note・YouTube の最新を取り込むため1時間ごとにも実行する。
name: Pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/fetch-feeds.mjs', '.github/workflows/pages.yml']
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: note・YouTube の最新を取得
        run: node scripts/fetch-feeds.mjs
      - id: pages
        uses: actions/configure-pages@v5
      - name: 共有用画像のURLを絶対パスにする（SNSのクローラー向け）
        run: sed -i "s#content=\"og.png\"#content=\"${{ steps.pages.outputs.base_url }}/og.png\"#" site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
